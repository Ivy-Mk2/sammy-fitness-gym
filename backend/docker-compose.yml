# MySQL 8 para desarrollo. Lee DB_PASSWORD del archivo backend/.env
# Uso (desde la carpeta backend/):  docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: sammy-gym-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en backend/.env}
      MYSQL_DATABASE: sammy_gym
      TZ: America/Lima
    ports:
      - "3306:3306"
    volumes:
      - sammy_gym_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sammy_gym_data:
