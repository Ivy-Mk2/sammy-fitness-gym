spring:
  datasource:
    url: jdbc:h2:mem:gymtest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  seed:
    password: Test12345
  jwt:
    # Valor solo para pruebas automatizadas (no se usa en ningún entorno real)
    secret: clave-de-pruebas-unitarias-no-usar-en-produccion-0123456789
    expiration-ms: 3600000
  cors:
    allowed-origin: http://localhost:4200
