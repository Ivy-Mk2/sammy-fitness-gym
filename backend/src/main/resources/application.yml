# Las credenciales se leen de variables de entorno o del archivo backend/.env (ver .env.example).
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: sammy-fitness-gym
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sammy_gym?createDatabaseIfNotExist=true&serverTimezone=America/Lima&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
    show-sql: ${JPA_SHOW_SQL:false}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true
  default-produces-media-type: application/json

app:
  seed:
    password: ${SEED_PASSWORD:}
  jwt:
    # Clave HMAC de al menos 32 caracteres. Obligatoria: la app no arranca sin ella.
    secret: ${JWT_SECRET}
    # Duración del token en milisegundos (por defecto 8 horas)
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:4200}
  # Zona horaria del gimnasio: define qué es "hoy" y si una clase ya pasó
  zona-horaria: ${APP_ZONA_HORARIA:America/Lima}
  membresias:
    # RN-06: todos los días a las 06:00 (segundo minuto hora día mes día-semana)
    cron: ${MEMBRESIAS_CRON:0 0 6 * * *}
    dias-aviso: 3
  mail:
    # Sin SENDGRID_API_KEY los correos solo se escriben en el log
    sendgrid-api-key: ${SENDGRID_API_KEY:}
    from: ${MAIL_FROM:no-reply@sammyfitness.test}
    from-name: ${MAIL_FROM_NAME:Sammy Fitness Gym}
